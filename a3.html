<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이중나선 · AI가 만드는 중 (A형)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07060d;color:#f3f1fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Apple SD Gothic Neo',sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* 씬이 자체 주입한 오버레이(일부 시안)는 숨기고, 공용 셸 오버레이(.ui/.err)만 보이게 — 카피 중복 방지 */
body>div:not(.ui):not(.err):not(.scrim){display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:22px 26px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8f48f3,#6f2ce0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(143,72,243,.5)}
.brand{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.brand span{color:#a79fc7;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:rgba(143,72,243,.16);color:#cdb9fb;border:1px solid rgba(143,72,243,.3);backdrop-filter:blur(6px)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#b78bff;box-shadow:0 0 10px 2px rgba(167,114,245,.8);animation:bp 1.6s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.1;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.lede{color:#b9b3d2;font-size:clamp(13.5px,1.5vw,16px);line-height:1.6;max-width:430px;text-shadow:0 1px 16px rgba(0,0,0,.7)}
.pct{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pct b{font-size:56px}.pct i{font-style:normal;font-size:24px;color:#cdb9fb;margin-left:3px}
.psub{color:#a79fc7;font-size:13px;font-weight:600;margin-top:2px}
/* 레이아웃: center = 화면 정중앙(오브 안 %), side = 왼쪽 텍스트, bottom = 하단 왼쪽 */
.wrap{flex:1;display:flex;position:relative}
.block{position:absolute;display:flex;flex-direction:column;gap:12px}
body.center .center-pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
body.center .copy{left:50%;bottom:11%;transform:translateX(-50%);align-items:center;text-align:center}
body.side .copy{left:7%;top:50%;transform:translateY(-50%);max-width:46%}
body.side .center-pct{display:none}
body.side .copy .pct{margin-top:6px}
body.bottom .copy{left:6.5%;bottom:9%;max-width:60%}
body.bottom .center-pct{display:none}
body.bottom .copy .pct{margin-top:8px}
/* 센터형은 가운데 큰 % 하나만 — 카피 블록의 중복 %는 숨김 */
body.center .copy .pct{display:none}
/* 가독성 스크림: 밝은 3D 위에서도 글자가 읽히게(캔버스 위, UI 아래) */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none}
body.center .scrim{background:radial-gradient(42% 42% at 50% 50%,rgba(7,6,13,.72),rgba(7,6,13,.28) 55%,transparent 72%)}
body.side .scrim{background:linear-gradient(90deg,rgba(7,6,13,.82) 0%,rgba(7,6,13,.5) 34%,transparent 60%)}
body.bottom .scrim{background:linear-gradient(0deg,rgba(7,6,13,.9) 0%,rgba(7,6,13,.5) 24%,transparent 46%),linear-gradient(90deg,rgba(7,6,13,.7) 0%,transparent 48%)}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;width:min(360px,70vw)}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8f48f3,#b78bff);width:0;transition:width .4s}
.foot{padding:20px 26px;color:#6f6a88;font-size:12px}
.err{position:fixed;inset:auto 0 0 0;z-index:5;background:#2a1030;color:#ffd4d4;font-size:12px;padding:8px 14px;display:none}
@media(prefers-reduced-motion:reduce){.badge .dot{animation:none}}
</style></head>
<body class="side">
<canvas id="bg"></canvas>
<div class="scrim"></div>
<div class="ui">
  <div class="top"><div class="logo">N</div><div class="brand">점핑클럽 <span>· 사이트 만들기</span></div></div>
  <div class="wrap">
    <div class="center-pct"><div class="pct"><b id="pc">0</b><i>%</i></div><div class="psub">디자인 생성 중</div></div>
    <div class="block copy">
      <span class="badge"><span class="dot"></span>8단계 · AI가 만드는 중</span>
      <h1>디자인을 그리고 있어요</h1>
      <p class="lede">첫 화면부터 보여드릴게요. 창을 닫아도 계속 만들어지고, 다 되면 이메일로 알려드립니다.</p>
      <div class="pct" data-copy-pct><b id="pc2">0</b><i>%</i></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
  </div>
  <div class="foot">Nophelon — AI 웹사이트 빌더 · 로딩 화면 시안 A3</div>
</div>
<div class="err" id="err"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// 진행률(데모) — 0→100 서서히. 오브 중앙 %와 카피 % 동기화.
(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var pc=document.getElementById('pc'),pc2=document.getElementById('pc2'),bar=document.getElementById('barfill');
  var p=0,target=92;
  function tick(){ p+=Math.max(.15,(target-p)*0.012); if(p>target)p=target; var n=Math.round(p);
    if(pc)pc.textContent=n; if(pc2)pc2.textContent=n; if(bar)bar.style.width=n+'%';
    window.__p=p/100; if(!reduce) requestAnimationFrame(tick); }
  if(reduce){ p=target; if(pc)pc.textContent=target; if(pc2)pc2.textContent=target; if(bar)bar.style.width=target+'%'; window.__p=.92; } else tick();
})();
// ── 3D 씬(페이블 작성) ──
function initScene(canvas) {
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setClearColor(0x07060d, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x07060d, 0.035);

  var camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  camera.position.set(0, 0, 12);

  // Helix group shifted toward right-center (overlay copy occupies left ~46%)
  var group = new THREE.Group();
  group.position.set(2.55, 0, 0);
  group.rotation.z = -0.1;
  scene.add(group);

  // ---------- palette ----------
  var C_CORE = new THREE.Color(0x8f48f3);
  var C_LIGHT = new THREE.Color(0xb78bff);
  var C_HI = new THREE.Color(0xd9c2ff);
  var C_DEEP = new THREE.Color(0x5a28c2);
  var tmpC = new THREE.Color();

  // ---------- soft gradient sprite (procedural, offscreen) ----------
  function makeGlowTexture() {
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g = c.getContext('2d');
    var grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0.0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.22, 'rgba(255,255,255,0.65)');
    grd.addColorStop(0.55, 'rgba(255,255,255,0.14)');
    grd.addColorStop(1.0, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    var t = new THREE.CanvasTexture(c);
    t.needsUpdate = true;
    return t;
  }
  var glowTex = makeGlowTexture();

  // ---------- helix parameters ----------
  var H = 9.2;                      // helix height
  var R = 1.55;                     // helix radius
  var TW = Math.PI * 2 * 2.6;       // total twist over height
  var N = 1150;                     // points per strand (2 strands)
  var NB = 90;                      // bright highlight nodes
  var ND = 520;                     // ambient dust
  var NR = 24;                      // connecting rungs

  // ---------- strand points ----------
  var sPos = new Float32Array(N * 2 * 3);
  var sCol = new Float32Array(N * 2 * 3);
  var sU = new Float32Array(N * 2);
  var sJ = new Float32Array(N * 2 * 3);
  var i, k;
  for (i = 0; i < N * 2; i++) {
    sU[i] = ((i % N) / N + Math.random() * 0.002) % 1;
    var loose = (i % 9 === 0) ? 0.16 : 0.045;
    sJ[i * 3] = (Math.random() - 0.5) * loose;
    sJ[i * 3 + 1] = (Math.random() - 0.5) * loose;
    sJ[i * 3 + 2] = (Math.random() - 0.5) * loose;
  }
  var sGeo = new THREE.BufferGeometry();
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos, 3));
  sGeo.setAttribute('color', new THREE.BufferAttribute(sCol, 3));
  var sMat = new THREE.PointsMaterial({
    size: 0.085, map: glowTex, vertexColors: true, transparent: true,
    opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var strands = new THREE.Points(sGeo, sMat);
  strands.frustumCulled = false;
  group.add(strands);

  // ---------- bright leading nodes ----------
  var bPos = new Float32Array(NB * 3);
  var bCol = new Float32Array(NB * 3);
  var bU = new Float32Array(NB);
  var bS = new Uint8Array(NB);
  for (i = 0; i < NB; i++) { bU[i] = Math.random(); bS[i] = i % 2; }
  var bGeo = new THREE.BufferGeometry();
  bGeo.setAttribute('position', new THREE.BufferAttribute(bPos, 3));
  bGeo.setAttribute('color', new THREE.BufferAttribute(bCol, 3));
  var bMat = new THREE.PointsMaterial({
    size: 0.3, map: glowTex, vertexColors: true, transparent: true,
    opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var brights = new THREE.Points(bGeo, bMat);
  brights.frustumCulled = false;
  group.add(brights);

  // ---------- ambient dust ----------
  var dPos = new Float32Array(ND * 3);
  var dCol = new Float32Array(ND * 3);
  var dU = new Float32Array(ND);
  var dR = new Float32Array(ND);
  var dA = new Float32Array(ND);
  for (i = 0; i < ND; i++) {
    dU[i] = Math.random();
    dR[i] = 1.9 + Math.random() * 2.4;
    dA[i] = Math.random() * Math.PI * 2;
  }
  var dGeo = new THREE.BufferGeometry();
  dGeo.setAttribute('position', new THREE.BufferAttribute(dPos, 3));
  dGeo.setAttribute('color', new THREE.BufferAttribute(dCol, 3));
  var dMat = new THREE.PointsMaterial({
    size: 0.11, map: glowTex, vertexColors: true, transparent: true,
    opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
  });
  var dust = new THREE.Points(dGeo, dMat);
  dust.frustumCulled = false;
  group.add(dust);

  // ---------- rungs (faint connecting lines between strands) ----------
  var rPos = new Float32Array(NR * 2 * 3);
  var rCol = new Float32Array(NR * 2 * 3);
  var rU = new Float32Array(NR);
  for (i = 0; i < NR; i++) rU[i] = i / NR;
  var rGeo = new THREE.BufferGeometry();
  rGeo.setAttribute('position', new THREE.BufferAttribute(rPos, 3));
  rGeo.setAttribute('color', new THREE.BufferAttribute(rCol, 3));
  var rMat = new THREE.LineBasicMaterial({
    vertexColors: true, transparent: true, opacity: 0.3,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  var rungs = new THREE.LineSegments(rGeo, rMat);
  rungs.frustumCulled = false;
  group.add(rungs);

  // ---------- helpers ----------
  function clamp01(v) { return v < 0 ? 0 : (v > 1 ? 1 : v); }
  function edgeFade(u) { var e = Math.min(u, 1 - u) * 7; return e > 1 ? 1 : e; }

  function helixXYZ(u, phase, rot, out) {
    var y = (u - 0.5) * H;
    var th = u * TW + phase + rot;
    out.x = Math.sin(th) * R;
    out.y = y;
    out.z = Math.cos(th) * R;
    return out;
  }
  var pA = new THREE.Vector3();
  var pB = new THREE.Vector3();

  // ---------- frame update ----------
  var scrollPos = 0;
  var rotPos = 0;

  function update(time, intensity) {
    var s, idx, u, y, th, r, x, z, f, fade, wave, br;

    // strands
    for (s = 0; s < 2; s++) {
      var phase = s * Math.PI;
      for (i = 0; i < N; i++) {
        idx = s * N + i;
        u = (sU[idx] + scrollPos) % 1;
        y = (u - 0.5) * H + sJ[idx * 3 + 1];
        th = u * TW + phase + rotPos;
        r = R * (1 + 0.03 * Math.sin(u * 37 + s * 2.1));
        x = Math.sin(th) * r + sJ[idx * 3];
        z = Math.cos(th) * r + sJ[idx * 3 + 2];

        k = idx * 3;
        sPos[k] = x; sPos[k + 1] = y; sPos[k + 2] = z;

        f = clamp01(z / R * 0.5 + 0.5);                       // front-facing factor
        fade = edgeFade(u);                                    // soft spawn/despawn
        wave = 0.72 + 0.28 * Math.sin(u * 12.0 - time * 2.2 + s * 3.1); // energy rising
        br = fade * wave * (0.42 + 0.68 * f) * intensity;

        tmpC.copy(C_DEEP).lerp(C_CORE, f).lerp(C_LIGHT, f * f * 0.7);
        sCol[k] = tmpC.r * br;
        sCol[k + 1] = tmpC.g * br;
        sCol[k + 2] = tmpC.b * br;
      }
    }
    sGeo.attributes.position.needsUpdate = true;
    sGeo.attributes.color.needsUpdate = true;

    // bright leading nodes
    for (i = 0; i < NB; i++) {
      u = (bU[i] + scrollPos) % 1;
      helixXYZ(u, bS[i] * Math.PI, rotPos, pA);
      k = i * 3;
      bPos[k] = pA.x; bPos[k + 1] = pA.y; bPos[k + 2] = pA.z;
      f = clamp01(pA.z / R * 0.5 + 0.5);
      fade = edgeFade(u);
      br = fade * (0.12 + 0.88 * f * f) * (0.75 + 0.25 * Math.sin(time * 3 + i * 1.7)) * intensity;
      tmpC.copy(C_LIGHT).lerp(C_HI, f);
      bCol[k] = tmpC.r * br;
      bCol[k + 1] = tmpC.g * br;
      bCol[k + 2] = tmpC.b * br;
    }
    bGeo.attributes.position.needsUpdate = true;
    bGeo.attributes.color.needsUpdate = true;

    // dust (slow rise, very faint, deep purple)
    for (i = 0; i < ND; i++) {
      u = (dU[i] + scrollPos * 0.35) % 1;
      var a = dA[i] + time * 0.03;
      k = i * 3;
      dPos[k] = Math.sin(a) * dR[i];
      dPos[k + 1] = (u - 0.5) * (H + 2.5);
      dPos[k + 2] = Math.cos(a) * dR[i];
      fade = edgeFade(u);
      br = fade * 0.10 * (0.6 + 0.4 * Math.sin(i * 13.7 + time * 0.9)) * intensity;
      dCol[k] = C_DEEP.r * br;
      dCol[k + 1] = C_DEEP.g * br;
      dCol[k + 2] = C_DEEP.b * br;
    }
    dGeo.attributes.position.needsUpdate = true;
    dGeo.attributes.color.needsUpdate = true;

    // rungs
    for (i = 0; i < NR; i++) {
      u = (rU[i] + scrollPos) % 1;
      helixXYZ(u, 0, rotPos, pA);
      helixXYZ(u, Math.PI, rotPos, pB);
      k = i * 6;
      rPos[k] = pA.x; rPos[k + 1] = pA.y; rPos[k + 2] = pA.z;
      rPos[k + 3] = pB.x; rPos[k + 4] = pB.y; rPos[k + 5] = pB.z;
      fade = edgeFade(u) * (0.55 + 0.45 * Math.sin(u * 9 - time * 2.2)) * intensity;
      var fa = clamp01(pA.z / R * 0.5 + 0.5);
      var fb = clamp01(pB.z / R * 0.5 + 0.5);
      tmpC.copy(C_DEEP).lerp(C_CORE, fa);
      rCol[k] = tmpC.r * fade * (0.25 + 0.5 * fa);
      rCol[k + 1] = tmpC.g * fade * (0.25 + 0.5 * fa);
      rCol[k + 2] = tmpC.b * fade * (0.25 + 0.5 * fa);
      tmpC.copy(C_DEEP).lerp(C_CORE, fb);
      rCol[k + 3] = tmpC.r * fade * (0.25 + 0.5 * fb);
      rCol[k + 4] = tmpC.g * fade * (0.25 + 0.5 * fb);
      rCol[k + 5] = tmpC.b * fade * (0.25 + 0.5 * fb);
    }
    rGeo.attributes.position.needsUpdate = true;
    rGeo.attributes.color.needsUpdate = true;

    // gentle camera breathing
    camera.position.x = Math.sin(time * 0.1) * 0.12;
    camera.position.y = Math.sin(time * 0.13) * 0.1;
    camera.position.z = 12 + Math.sin(time * 0.07) * 0.12;
    group.rotation.x = Math.sin(time * 0.09) * 0.04;
  }

  // ---------- resize ----------
  function resize() {
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(1, h);
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function readP() {
    var p = (typeof window.__p === 'number') ? window.__p : 0.5;
    return 0.65 + 0.35 * clamp01(p);
  }

  // ---------- reduced motion: single refined frame ----------
  var reduced = (typeof window.matchMedia === 'function') &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) {
    scrollPos = 0.37;
    rotPos = 0.9;
    update(0.8, readP());
    renderer.render(scene, camera);
    return;
  }

  // ---------- animation loop ----------
  var clock = new THREE.Clock();
  var time = 0;
  function tick() {
    requestAnimationFrame(tick);
    var dt = Math.min(0.05, clock.getDelta());
    time += dt;
    var p = clamp01((typeof window.__p === 'number') ? window.__p : 0.5);
    scrollPos += dt * (0.05 + 0.03 * p);   // upward weaving speed
    rotPos += dt * 0.28;                   // slow Y rotation
    update(time, 0.65 + 0.35 * p);
    renderer.render(scene, camera);
  }
  tick();
}
try{ initScene(document.getElementById('bg')); }
catch(e){ var el=document.getElementById('err'); el.style.display='block'; el.textContent='3D 씬 오류: '+(e&&e.message||e); console.error(e); }
</script>
</body></html>
