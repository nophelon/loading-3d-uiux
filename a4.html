<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>모핑 블롭 · AI가 만드는 중 (A형)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07060d;color:#f3f1fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Apple SD Gothic Neo',sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* 씬이 자체 주입한 오버레이(일부 시안)는 숨기고, 공용 셸 오버레이(.ui/.err)만 보이게 — 카피 중복 방지 */
body>div:not(.ui):not(.err):not(.scrim){display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:22px 26px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8f48f3,#6f2ce0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(143,72,243,.5)}
.brand{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.brand span{color:#a79fc7;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:rgba(143,72,243,.16);color:#cdb9fb;border:1px solid rgba(143,72,243,.3);backdrop-filter:blur(6px)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#b78bff;box-shadow:0 0 10px 2px rgba(167,114,245,.8);animation:bp 1.6s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.1;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.lede{color:#b9b3d2;font-size:clamp(13.5px,1.5vw,16px);line-height:1.6;max-width:430px;text-shadow:0 1px 16px rgba(0,0,0,.7)}
.pct{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pct b{font-size:56px}.pct i{font-style:normal;font-size:24px;color:#cdb9fb;margin-left:3px}
.psub{color:#a79fc7;font-size:13px;font-weight:600;margin-top:2px}
/* 레이아웃: center = 화면 정중앙(오브 안 %), side = 왼쪽 텍스트, bottom = 하단 왼쪽 */
.wrap{flex:1;display:flex;position:relative}
.block{position:absolute;display:flex;flex-direction:column;gap:12px}
body.center .center-pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
body.center .copy{left:50%;bottom:11%;transform:translateX(-50%);align-items:center;text-align:center}
body.side .copy{left:7%;top:50%;transform:translateY(-50%);max-width:46%}
body.side .center-pct{display:none}
body.side .copy .pct{margin-top:6px}
body.bottom .copy{left:6.5%;bottom:9%;max-width:60%}
body.bottom .center-pct{display:none}
body.bottom .copy .pct{margin-top:8px}
/* 센터형은 가운데 큰 % 하나만 — 카피 블록의 중복 %는 숨김 */
body.center .copy .pct{display:none}
/* 가독성 스크림: 밝은 3D 위에서도 글자가 읽히게(캔버스 위, UI 아래) */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none}
body.center .scrim{background:radial-gradient(42% 42% at 50% 50%,rgba(7,6,13,.72),rgba(7,6,13,.28) 55%,transparent 72%)}
body.side .scrim{background:linear-gradient(90deg,rgba(7,6,13,.82) 0%,rgba(7,6,13,.5) 34%,transparent 60%)}
body.bottom .scrim{background:linear-gradient(0deg,rgba(7,6,13,.9) 0%,rgba(7,6,13,.5) 24%,transparent 46%),linear-gradient(90deg,rgba(7,6,13,.7) 0%,transparent 48%)}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;width:min(360px,70vw)}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8f48f3,#b78bff);width:0;transition:width .4s}
.foot{padding:20px 26px;color:#6f6a88;font-size:12px}
.err{position:fixed;inset:auto 0 0 0;z-index:5;background:#2a1030;color:#ffd4d4;font-size:12px;padding:8px 14px;display:none}
@media(prefers-reduced-motion:reduce){.badge .dot{animation:none}}
</style></head>
<body class="center">
<canvas id="bg"></canvas>
<div class="scrim"></div>
<div class="ui">
  <div class="top"><div class="logo">N</div><div class="brand">점핑클럽 <span>· 사이트 만들기</span></div></div>
  <div class="wrap">
    <div class="center-pct"><div class="pct"><b id="pc">0</b><i>%</i></div><div class="psub">디자인 생성 중</div></div>
    <div class="block copy">
      <span class="badge"><span class="dot"></span>8단계 · AI가 만드는 중</span>
      <h1>디자인을 그리고 있어요</h1>
      <p class="lede">첫 화면부터 보여드릴게요. 창을 닫아도 계속 만들어지고, 다 되면 이메일로 알려드립니다.</p>
      <div class="pct" data-copy-pct><b id="pc2">0</b><i>%</i></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
  </div>
  <div class="foot">Nophelon — AI 웹사이트 빌더 · 로딩 화면 시안 A4</div>
</div>
<div class="err" id="err"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// 진행률(데모) — 0→100 서서히. 오브 중앙 %와 카피 % 동기화.
(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var pc=document.getElementById('pc'),pc2=document.getElementById('pc2'),bar=document.getElementById('barfill');
  var p=0,target=92;
  function tick(){ p+=Math.max(.15,(target-p)*0.012); if(p>target)p=target; var n=Math.round(p);
    if(pc)pc.textContent=n; if(pc2)pc2.textContent=n; if(bar)bar.style.width=n+'%';
    window.__p=p/100; if(!reduce) requestAnimationFrame(tick); }
  if(reduce){ p=target; if(pc)pc.textContent=target; if(pc2)pc2.textContent=target; if(bar)bar.style.width=target+'%'; window.__p=.92; } else tick();
})();
// ── 3D 씬(페이블 작성) ──
// ─────────────────────────────────────────────────────────────────────────────
// "Morphing Blob" — premium AI-generating loading scene (Three.js r160 UMD)
// Living purple nucleus: noise-displaced icosphere rendered as glowing points
// + faint structural wireframe. Procedural everything. ≤ ~3.6k vertices.
// ─────────────────────────────────────────────────────────────────────────────

function initScene(canvas) {
  'use strict';

  // ---------- renderer / scene / camera ----------
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
  var W = canvas.clientWidth || window.innerWidth;
  var H = canvas.clientHeight || window.innerHeight;
  renderer.setSize(W, H, false);
  renderer.setClearColor(0x07060d, 1);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(42, W / H, 0.1, 50);
  camera.position.set(0, 0, 3.6);

  // ---------- palette ----------
  var DEEP = [0.3529, 0.1569, 0.7608];  // #5a28c2 trough
  var CORE = [0.5608, 0.2824, 0.9529];  // #8f48f3 body
  var LITE = [0.7176, 0.5451, 1.0];     // #b78bff crest
  var HIGH = [0.8510, 0.7608, 1.0];     // #d9c2ff crest peak

  // ---------- own 3D value noise (hash + quintic smooth interpolation) ----------
  function hash3(ix, iy, iz) {
    var n = (Math.imul(ix, 374761393) + Math.imul(iy, 668265263) + Math.imul(iz, 1274126177)) | 0;
    n = Math.imul(n ^ (n >>> 13), 1103515245) | 0;
    n = (n ^ (n >>> 16)) >>> 0;
    return n * (1 / 4294967295);
  }
  function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
  function vnoise(x, y, z) {
    var xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    var fx = x - xi, fy = y - yi, fz = z - zi;
    var u = fade(fx), v = fade(fy), w = fade(fz);
    var c000 = hash3(xi, yi, zi),         c100 = hash3(xi + 1, yi, zi);
    var c010 = hash3(xi, yi + 1, zi),     c110 = hash3(xi + 1, yi + 1, zi);
    var c001 = hash3(xi, yi, zi + 1),     c101 = hash3(xi + 1, yi, zi + 1);
    var c011 = hash3(xi, yi + 1, zi + 1), c111 = hash3(xi + 1, yi + 1, zi + 1);
    var x00 = c000 + (c100 - c000) * u, x10 = c010 + (c110 - c010) * u;
    var x01 = c001 + (c101 - c001) * u, x11 = c011 + (c111 - c011) * u;
    var y0 = x00 + (x10 - x00) * v,     y1 = x01 + (x11 - x01) * v;
    return y0 + (y1 - y0) * w; // 0..1
  }
  function fbm(x, y, z) { // 3 octaves, normalized 0..1
    return (vnoise(x, y, z) * 0.5 +
            vnoise(x * 2.03 + 11.7, y * 2.03 + 5.1, z * 2.03 + 7.9) * 0.25 +
            vnoise(x * 4.07 + 23.3, y * 4.07 + 17.2, z * 4.07 + 31.1) * 0.125) / 0.875;
  }

  // ---------- unique-vertex icosphere extraction ----------
  function uniqueSphere(detail) {
    var g = new THREE.IcosahedronGeometry(1, detail);
    var p = g.getAttribute('position');
    var map = Object.create(null), dirs = [], index = [];
    for (var i = 0; i < p.count; i++) {
      var x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      var k = (Math.round(x * 1e4)) + '_' + (Math.round(y * 1e4)) + '_' + (Math.round(z * 1e4));
      var id = map[k];
      if (id === undefined) {
        var L = 1 / Math.sqrt(x * x + y * y + z * z);
        id = map[k] = dirs.length / 3;
        dirs.push(x * L, y * L, z * L);
      }
      index.push(id);
    }
    g.dispose();
    return { dirs: new Float32Array(dirs), index: index };
  }

  var ptsMesh = uniqueSphere(4);           // 2562 unique point directions
  var wireMesh = uniqueSphere(2);          // 162 verts / 480 unique edges
  var PN = ptsMesh.dirs.length / 3;
  var WN = wireMesh.dirs.length / 3;

  var edges = [];
  (function () {
    var seen = Object.create(null), ix = wireMesh.index;
    for (var f = 0; f < ix.length; f += 3) {
      for (var e = 0; e < 3; e++) {
        var a = ix[f + e], b = ix[f + ((e + 1) % 3)];
        var k = a < b ? a * 65536 + b : b * 65536 + a;
        if (!seen[k]) { seen[k] = 1; edges.push(a, b); }
      }
    }
  })();
  var EN = edges.length; // 960 line endpoints

  // ---------- soft sprite textures (tiny offscreen gradients) ----------
  function gradTex(size, stops) {
    var cv = document.createElement('canvas');
    cv.width = cv.height = size;
    var cx = cv.getContext('2d');
    var gr = cx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    for (var i = 0; i < stops.length; i++) gr.addColorStop(stops[i][0], stops[i][1]);
    cx.fillStyle = gr;
    cx.fillRect(0, 0, size, size);
    var t = new THREE.CanvasTexture(cv);
    t.needsUpdate = true;
    return t;
  }
  var dotTex = gradTex(64, [
    [0.0, 'rgba(255,255,255,1)'],
    [0.3, 'rgba(255,255,255,0.55)'],
    [0.65, 'rgba(255,255,255,0.12)'],
    [1.0, 'rgba(255,255,255,0)']
  ]);
  var haloTex = gradTex(128, [
    [0.0, 'rgba(143,72,243,0.55)'],
    [0.45, 'rgba(90,40,194,0.22)'],
    [1.0, 'rgba(90,40,194,0)']
  ]);

  // ---------- geometry buffers ----------
  var pPos = new Float32Array(PN * 3);
  var pCol = new Float32Array(PN * 3);
  var pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
  pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));

  var points = new THREE.Points(pGeo, new THREE.PointsMaterial({
    size: 0.05,
    map: dotTex,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending,
    sizeAttenuation: true
  }));

  var wPosTmp = new Float32Array(WN * 3);
  var lPos = new Float32Array(EN * 3);
  var lGeo = new THREE.BufferGeometry();
  lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3).setUsage(THREE.DynamicDrawUsage));

  var wire = new THREE.LineSegments(lGeo, new THREE.LineBasicMaterial({
    color: 0x8f48f3,
    transparent: true,
    opacity: 0.09,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  }));

  var halo = new THREE.Sprite(new THREE.SpriteMaterial({
    map: haloTex,
    transparent: true,
    opacity: 0.16,
    depthWrite: false,
    depthTest: false,
    blending: THREE.AdditiveBlending
  }));
  halo.scale.set(4.4, 4.4, 1);
  halo.position.z = -0.6;

  var blob = new THREE.Group();
  blob.add(points);
  blob.add(wire);
  scene.add(halo);
  scene.add(blob);

  // ---------- helpers ----------
  function progress() {
    var v = window.__p;
    return (typeof v === 'number' && isFinite(v)) ? Math.min(1, Math.max(0, v)) : 0;
  }

  // ---------- per-frame morph ----------
  var FREQ = 1.35;
  function update(t) {
    var p = progress();
    var nt = t * (0.26 + 0.22 * p);                       // noise evolution speed
    var ox = nt * 0.9, oy = nt * 0.7 + 13.37, oz = -nt * 0.8 + 41.2;
    var amp = 0.15 + 0.05 * Math.sin(t * 0.33) + 0.07 * p; // morph strength
    var pulse = 1 + 0.035 * Math.sin(t * 0.9);             // breathing
    var energy = 0.78 + 0.3 * p;

    var ry = t * 0.12, rx = Math.sin(t * 0.07) * 0.22;
    blob.rotation.set(rx, ry, 0);
    var sy = Math.sin(ry), cy = Math.cos(ry);
    var sx = Math.sin(rx), cx2 = Math.cos(rx);

    // points: displace along normal, colour by crest height, dim camera-facing
    // zone so the centered % overlay stays readable
    var d = ptsMesh.dirs, i, j, x, y, z, n, r, h;
    for (i = 0, j = 0; i < PN; i++, j += 3) {
      x = d[j]; y = d[j + 1]; z = d[j + 2];
      n = fbm(x * FREQ + ox, y * FREQ + oy, z * FREQ + oz);     // 0..1
      r = (1 + (n - 0.5) * 2 * amp) * pulse;
      pPos[j] = x * r; pPos[j + 1] = y * r; pPos[j + 2] = z * r;

      h = n;
      var cr, cg, cb;
      if (h < 0.5) {
        var u = h * 2;
        cr = DEEP[0] + (CORE[0] - DEEP[0]) * u;
        cg = DEEP[1] + (CORE[1] - DEEP[1]) * u;
        cb = DEEP[2] + (CORE[2] - DEEP[2]) * u;
      } else {
        var v = (h - 0.5) * 2;
        cr = CORE[0] + (LITE[0] - CORE[0]) * v;
        cg = CORE[1] + (LITE[1] - CORE[1]) * v;
        cb = CORE[2] + (LITE[2] - CORE[2]) * v;
      }
      if (h > 0.8) { // crest peaks flash toward highlight
        var k = (h - 0.8) * 5 * 0.85;
        cr += (HIGH[0] - cr) * k; cg += (HIGH[1] - cg) * k; cb += (HIGH[2] - cb) * k;
      }
      // world-space facing (manual Ry then Rx) → rim bright, center airy
      var wx = x * cy + z * sy;
      var wz1 = -x * sy + z * cy;
      var wz = y * sx + wz1 * cx2;
      var facing = wz > 0 ? wz : 0;
      var fadeC = (0.42 + 0.58 * (1 - facing * facing)) * energy;
      pCol[j] = cr * fadeC; pCol[j + 1] = cg * fadeC; pCol[j + 2] = cb * fadeC;
    }
    pGeo.attributes.position.needsUpdate = true;
    pGeo.attributes.color.needsUpdate = true;

    // wireframe: same noise field, coarse structure
    var wd = wireMesh.dirs;
    for (i = 0, j = 0; i < WN; i++, j += 3) {
      x = wd[j]; y = wd[j + 1]; z = wd[j + 2];
      n = fbm(x * FREQ + ox, y * FREQ + oy, z * FREQ + oz);
      r = (1 + (n - 0.5) * 2 * amp) * pulse;
      wPosTmp[j] = x * r; wPosTmp[j + 1] = y * r; wPosTmp[j + 2] = z * r;
    }
    for (i = 0; i < EN; i++) {
      var s = edges[i] * 3, o = i * 3;
      lPos[o] = wPosTmp[s]; lPos[o + 1] = wPosTmp[s + 1]; lPos[o + 2] = wPosTmp[s + 2];
    }
    lGeo.attributes.position.needsUpdate = true;

    wire.material.opacity = 0.07 + 0.03 * (0.5 + 0.5 * Math.sin(t * 0.6));
    halo.material.opacity = 0.13 + 0.05 * (0.5 + 0.5 * Math.sin(t * 0.8)) + 0.05 * p;
    var hs = 4.4 * pulse;
    halo.scale.set(hs, hs, 1);
  }

  // ---------- resize ----------
  function onResize() {
    var w = canvas.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || window.innerHeight;
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);

  // ---------- loop (reduced motion → single frame) ----------
  var reduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduced) {
    update(2.6);
    renderer.render(scene, camera);
    window.addEventListener('resize', function () { renderer.render(scene, camera); });
    return;
  }

  var clock = new THREE.Clock();
  (function animate() {
    requestAnimationFrame(animate);
    update(clock.getElapsedTime());
    renderer.render(scene, camera);
  })();
}
try{ initScene(document.getElementById('bg')); }
catch(e){ var el=document.getElementById('err'); el.style.display='block'; el.textContent='3D 씬 오류: '+(e&&e.message||e); console.error(e); }
</script>
</body></html>
