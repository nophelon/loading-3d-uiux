<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보텍스 소용돌이 · AI가 만드는 중 (A형)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#07060d;color:#f3f1fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Pretendard','Apple SD Gothic Neo',sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
/* 씬이 자체 주입한 오버레이(일부 시안)는 숨기고, 공용 셸 오버레이(.ui/.err)만 보이게 — 카피 중복 방지 */
body>div:not(.ui):not(.err):not(.scrim){display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:22px 26px}
.logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#8f48f3,#6f2ce0);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:14px;box-shadow:0 4px 14px rgba(143,72,243,.5)}
.brand{font-weight:650;font-size:14.5px;letter-spacing:-.01em}
.brand span{color:#a79fc7;font-weight:500}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;background:rgba(143,72,243,.16);color:#cdb9fb;border:1px solid rgba(143,72,243,.3);backdrop-filter:blur(6px)}
.badge .dot{width:7px;height:7px;border-radius:50%;background:#b78bff;box-shadow:0 0 10px 2px rgba(167,114,245,.8);animation:bp 1.6s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:clamp(26px,4.6vw,44px);font-weight:700;letter-spacing:-.025em;line-height:1.1;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.lede{color:#b9b3d2;font-size:clamp(13.5px,1.5vw,16px);line-height:1.6;max-width:430px;text-shadow:0 1px 16px rgba(0,0,0,.7)}
.pct{font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.pct b{font-size:56px}.pct i{font-style:normal;font-size:24px;color:#cdb9fb;margin-left:3px}
.psub{color:#a79fc7;font-size:13px;font-weight:600;margin-top:2px}
/* 레이아웃: center = 화면 정중앙(오브 안 %), side = 왼쪽 텍스트, bottom = 하단 왼쪽 */
.wrap{flex:1;display:flex;position:relative}
.block{position:absolute;display:flex;flex-direction:column;gap:12px}
body.center .center-pct{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
body.center .copy{left:50%;bottom:11%;transform:translateX(-50%);align-items:center;text-align:center}
body.side .copy{left:7%;top:50%;transform:translateY(-50%);max-width:46%}
body.side .center-pct{display:none}
body.side .copy .pct{margin-top:6px}
body.bottom .copy{left:6.5%;bottom:9%;max-width:60%}
body.bottom .center-pct{display:none}
body.bottom .copy .pct{margin-top:8px}
/* 센터형은 가운데 큰 % 하나만 — 카피 블록의 중복 %는 숨김 */
body.center .copy .pct{display:none}
/* 가독성 스크림: 밝은 3D 위에서도 글자가 읽히게(캔버스 위, UI 아래) */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none}
body.center .scrim{background:radial-gradient(42% 42% at 50% 50%,rgba(7,6,13,.72),rgba(7,6,13,.28) 55%,transparent 72%)}
body.side .scrim{background:linear-gradient(90deg,rgba(7,6,13,.82) 0%,rgba(7,6,13,.5) 34%,transparent 60%)}
body.bottom .scrim{background:linear-gradient(0deg,rgba(7,6,13,.9) 0%,rgba(7,6,13,.5) 24%,transparent 46%),linear-gradient(90deg,rgba(7,6,13,.7) 0%,transparent 48%)}
.bar{height:4px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;width:min(360px,70vw)}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#8f48f3,#b78bff);width:0;transition:width .4s}
.foot{padding:20px 26px;color:#6f6a88;font-size:12px}
.err{position:fixed;inset:auto 0 0 0;z-index:5;background:#2a1030;color:#ffd4d4;font-size:12px;padding:8px 14px;display:none}
@media(prefers-reduced-motion:reduce){.badge .dot{animation:none}}
</style></head>
<body class="center">
<canvas id="bg"></canvas>
<div class="scrim"></div>
<div class="ui">
  <div class="top"><div class="logo">N</div><div class="brand">점핑클럽 <span>· 사이트 만들기</span></div></div>
  <div class="wrap">
    <div class="center-pct"><div class="pct"><b id="pc">0</b><i>%</i></div><div class="psub">디자인 생성 중</div></div>
    <div class="block copy">
      <span class="badge"><span class="dot"></span>8단계 · AI가 만드는 중</span>
      <h1>디자인을 그리고 있어요</h1>
      <p class="lede">첫 화면부터 보여드릴게요. 창을 닫아도 계속 만들어지고, 다 되면 이메일로 알려드립니다.</p>
      <div class="pct" data-copy-pct><b id="pc2">0</b><i>%</i></div>
      <div class="bar"><i id="barfill"></i></div>
    </div>
  </div>
  <div class="foot">Nophelon — AI 웹사이트 빌더 · 로딩 화면 시안 A2</div>
</div>
<div class="err" id="err"></div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
// 진행률(데모) — 0→100 서서히. 오브 중앙 %와 카피 % 동기화.
(function(){
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var pc=document.getElementById('pc'),pc2=document.getElementById('pc2'),bar=document.getElementById('barfill');
  var p=0,target=92;
  function tick(){ p+=Math.max(.15,(target-p)*0.012); if(p>target)p=target; var n=Math.round(p);
    if(pc)pc.textContent=n; if(pc2)pc2.textContent=n; if(bar)bar.style.width=n+'%';
    window.__p=p/100; if(!reduce) requestAnimationFrame(tick); }
  if(reduce){ p=target; if(pc)pc.textContent=target; if(pc2)pc2.textContent=target; if(bar)bar.style.width=target+'%'; window.__p=.92; } else tick();
})();
// ── 3D 씬(페이블 작성) ──
function initScene(canvas){
  var PR = Math.min(2, window.devicePixelRatio || 1);
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(PR);
  renderer.setSize(canvas.clientWidth || canvas.width, canvas.clientHeight || canvas.height, false);
  renderer.setClearColor(0x07060d, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x07060d, 0.055);

  var camera = new THREE.PerspectiveCamera(55, (canvas.clientWidth || 1) / (canvas.clientHeight || 1), 0.1, 60);
  camera.position.set(0, 2.9, 7.6);
  camera.lookAt(0, -0.45, 0);

  var root = new THREE.Group();
  scene.add(root);

  // ---------- soft round sprite (procedural, offscreen) ----------
  function makeDot(sz, stops){
    var cv = document.createElement('canvas');
    cv.width = cv.height = sz;
    var ctx = cv.getContext('2d');
    var g = ctx.createRadialGradient(sz/2, sz/2, 0, sz/2, sz/2, sz/2);
    for (var i = 0; i < stops.length; i++) g.addColorStop(stops[i][0], stops[i][1]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, sz, sz);
    var t = new THREE.CanvasTexture(cv);
    t.needsUpdate = true;
    return t;
  }
  var dotTex = makeDot(64, [
    [0.0, 'rgba(255,255,255,1)'],
    [0.22,'rgba(255,255,255,0.85)'],
    [0.5, 'rgba(255,255,255,0.22)'],
    [1.0, 'rgba(255,255,255,0)']
  ]);
  var glowTex = makeDot(128, [
    [0.0, 'rgba(255,255,255,0.9)'],
    [0.3, 'rgba(255,255,255,0.32)'],
    [0.65,'rgba(255,255,255,0.08)'],
    [1.0, 'rgba(255,255,255,0)']
  ]);

  // ---------- color LUT: rim(deep) -> core -> light -> highlight -> hot ----------
  var LUT_N = 256;
  var lut = new Float32Array(LUT_N * 3);
  (function(){
    var stops = [
      [0.00, new THREE.Color(0x3d1c86)],
      [0.30, new THREE.Color(0x5a28c2)],
      [0.58, new THREE.Color(0x8f48f3)],
      [0.80, new THREE.Color(0xb78bff)],
      [0.93, new THREE.Color(0xd9c2ff)],
      [1.00, new THREE.Color(0xf4ecff)]
    ];
    var c = new THREE.Color();
    for (var i = 0; i < LUT_N; i++){
      var t = i / (LUT_N - 1), a = stops[0], b = stops[stops.length - 1];
      for (var s = 0; s < stops.length - 1; s++){
        if (t >= stops[s][0] && t <= stops[s + 1][0]){ a = stops[s]; b = stops[s + 1]; break; }
      }
      var f = (b[0] === a[0]) ? 0 : (t - a[0]) / (b[0] - a[0]);
      c.copy(a[1]).lerp(b[1], f);
      lut[i * 3] = c.r; lut[i * 3 + 1] = c.g; lut[i * 3 + 2] = c.b;
    }
  })();

  // ---------- vortex particle system ----------
  var COUNT = 6000;              // + 800 dust = 6800 total (<= 7000)
  var R_MAX = 5.2;               // world radius of the funnel rim
  var DEPTH = 1.7;               // how deep the funnel sinks at the throat
  var HOLE  = 0.05;              // normalized respawn radius
  var FADE_R = 0.17;             // start fading as particles approach the throat

  var pos   = new Float32Array(COUNT * 3);
  var col   = new Float32Array(COUNT * 3);
  var sizeA = new Float32Array(COUNT);
  var alpA  = new Float32Array(COUNT);

  // simulation state (CPU)
  var rn    = new Float32Array(COUNT);   // normalized radius 0..~1.2
  var theta = new Float32Array(COUNT);
  var thick = new Float32Array(COUNT);   // vertical scatter -1..1
  var age   = new Float32Array(COUNT);
  var baseS = new Float32Array(COUNT);
  var seed  = new Float32Array(COUNT);

  function spawn(i, initial){
    rn[i]    = initial ? (0.06 + Math.pow(Math.random(), 0.62) * 1.12)
                       : (0.96 + Math.random() * 0.22);
    theta[i] = Math.random() * Math.PI * 2;
    thick[i] = (Math.random() * 2 - 1) * (0.6 + Math.random() * 0.4);
    age[i]   = initial ? (1 + Math.random() * 5) : 0;
    baseS[i] = 0.085 + Math.pow(Math.random(), 1.7) * 0.17;
    seed[i]  = Math.random() * Math.PI * 2;
  }
  for (var i = 0; i < COUNT; i++) spawn(i, true);

  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aColor',   new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aSize',    new THREE.BufferAttribute(sizeA, 1).setUsage(THREE.DynamicDrawUsage));
  geo.setAttribute('aAlpha',   new THREE.BufferAttribute(alpA, 1).setUsage(THREE.DynamicDrawUsage));

  var uni = {
    uMap:   { value: dotTex },
    uPR:    { value: PR },
    uBoost: { value: 1.0 }
  };
  var mat = new THREE.ShaderMaterial({
    uniforms: uni,
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    vertexShader: [
      'uniform float uPR;',
      'attribute float aSize;',
      'attribute float aAlpha;',
      'attribute vec3 aColor;',
      'varying float vA;',
      'varying vec3 vC;',
      'void main(){',
      '  vec4 mv = modelViewMatrix * vec4(position, 1.0);',
      '  gl_PointSize = max(1.0, aSize * uPR * (300.0 / -mv.z));',
      '  vA = aAlpha;',
      '  vC = aColor;',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'uniform sampler2D uMap;',
      'uniform float uBoost;',
      'varying float vA;',
      'varying vec3 vC;',
      'void main(){',
      '  float m = texture2D(uMap, gl_PointCoord).a;',
      '  float a = m * vA * uBoost;',
      '  if (a < 0.003) discard;',
      '  gl_FragColor = vec4(vC * a, a);',
      '}'
    ].join('\n')
  });
  var points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  root.add(points);

  // ---------- ambient dust shell (slow drift, very dim) ----------
  var DUST = 800;
  var dpos = new Float32Array(DUST * 3);
  for (var d = 0; d < DUST; d++){
    var rr = 6 + Math.random() * 9;
    var an = Math.random() * Math.PI * 2;
    dpos[d * 3]     = Math.cos(an) * rr;
    dpos[d * 3 + 1] = (Math.random() * 2 - 1) * 5.5;
    dpos[d * 3 + 2] = Math.sin(an) * rr;
  }
  var dgeo = new THREE.BufferGeometry();
  dgeo.setAttribute('position', new THREE.BufferAttribute(dpos, 3));
  var dmat = new THREE.PointsMaterial({
    map: dotTex, color: 0x5a28c2, size: 0.085, sizeAttenuation: true,
    transparent: true, opacity: 0.4, depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  var dust = new THREE.Points(dgeo, dmat);
  dust.frustumCulled = false;
  scene.add(dust);

  // ---------- core glow (emissive heart of the vortex) ----------
  var throatY = -DEPTH * 0.82;
  var haloMat = new THREE.SpriteMaterial({
    map: glowTex, color: 0x8f48f3, transparent: true, opacity: 0.38,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  var halo = new THREE.Sprite(haloMat);
  halo.position.set(0, throatY, 0);
  halo.scale.set(4.6, 4.6, 1);
  root.add(halo);

  var coreMat = new THREE.SpriteMaterial({
    map: glowTex, color: 0xd9c2ff, transparent: true, opacity: 0.5,
    depthWrite: false, blending: THREE.AdditiveBlending
  });
  var core = new THREE.Sprite(coreMat);
  core.position.set(0, throatY, 0);
  core.scale.set(1.35, 1.35, 1);
  root.add(core);

  // ---------- simulation ----------
  function progress(){
    var p = (typeof window.__p === 'number') ? window.__p : 0;
    return p < 0 ? 0 : (p > 1 ? 1 : p);
  }

  function step(dt, t){
    var p = progress();
    var speed = 1.0 + p * 1.25;
    uni.uBoost.value = 1.0 + p * 0.85;
    haloMat.opacity = 0.34 + p * 0.18 + Math.sin(t * 1.3) * 0.035;
    coreMat.opacity = 0.44 + p * 0.22 + Math.sin(t * 2.1 + 1.0) * 0.05;
    var pulse = 1 + Math.sin(t * 1.6) * 0.06;
    halo.scale.set(4.6 * pulse, 4.6 * pulse, 1);
    core.scale.set(1.35 * (2 - pulse), 1.35 * (2 - pulse), 1);

    root.rotation.y += dt * 0.05;
    dust.rotation.y -= dt * 0.012;

    for (var i = 0; i < COUNT; i++){
      age[i] += dt;
      var r = rn[i];

      // inflow: slow at the rim, accelerating toward the throat
      var inv = 1.0 - Math.min(1, r);
      rn[i] = r = r - dt * speed * (0.028 + 0.26 * inv * inv);

      if (r <= HOLE){ spawn(i, false); r = rn[i]; }

      // angular speed rises sharply as radius shrinks (capped)
      var om = 0.22 + 0.5 / (0.055 + r * r);
      if (om > 5.2) om = 5.2;
      theta[i] += dt * om * speed;

      var wr = r * R_MAX;
      var th = theta[i];
      // mild orbital wobble so the flow looks organic, not mechanical
      var wob = Math.sin(t * 1.7 + seed[i]) * 0.055 * r;
      var x = Math.cos(th) * (wr + wob);
      var z = Math.sin(th) * (wr + wob);
      var fall = 1.0 - Math.min(1, r);
      var y = -DEPTH * Math.pow(fall, 1.75)
            + thick[i] * (0.1 + r * 0.95)
            + Math.sin(th * 3.0 + t * 0.8 + seed[i]) * 0.05 * r;

      var j = i * 3;
      pos[j] = x; pos[j + 1] = y; pos[j + 2] = z;

      // alpha: fade-in on spawn, dim rim, brighten inward, vanish into the hole
      var a = age[i] / 0.65; if (a > 1) a = 1;
      a *= 0.3 + 0.75 * fall;
      if (r < FADE_R) a *= (r - HOLE) / (FADE_R - HOLE);
      if (a < 0) a = 0;
      alpA[i] = a;

      sizeA[i] = baseS[i] * (0.68 + fall * 0.85);

      var heat = fall; // 0 at rim -> 1 at center
      var li = (heat * (LUT_N - 1)) | 0;
      var l3 = li * 3;
      col[j] = lut[l3]; col[j + 1] = lut[l3 + 1]; col[j + 2] = lut[l3 + 2];
    }
    geo.attributes.position.needsUpdate = true;
    geo.attributes.aColor.needsUpdate = true;
    geo.attributes.aSize.needsUpdate = true;
    geo.attributes.aAlpha.needsUpdate = true;

    // gentle cinematic camera breathing
    camera.position.x = Math.sin(t * 0.09) * 0.45;
    camera.position.y = 2.9 + Math.sin(t * 0.13) * 0.18;
    camera.lookAt(0, -0.45, 0);
  }

  // ---------- resize ----------
  function onResize(){
    var w = canvas.clientWidth || canvas.parentNode && canvas.parentNode.clientWidth || window.innerWidth;
    var h = canvas.clientHeight || canvas.parentNode && canvas.parentNode.clientHeight || window.innerHeight;
    PR = Math.min(2, window.devicePixelRatio || 1);
    uni.uPR.value = PR;
    renderer.setPixelRatio(PR);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  onResize();

  // ---------- loop / reduced motion ----------
  var clock = new THREE.Clock();
  var reduced = false;
  try {
    reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  } catch (e) { reduced = false; }

  // settle the field so even a single frame looks like a living vortex
  for (var w0 = 0; w0 < 24; w0++) step(1 / 30, w0 / 30);

  if (reduced){
    renderer.render(scene, camera);
    return;
  }

  var tAcc = 0.8;
  function frame(){
    requestAnimationFrame(frame);
    var dt = clock.getDelta();
    if (dt > 0.05) dt = 0.05;
    tAcc += dt;
    step(dt, tAcc);
    renderer.render(scene, camera);
  }
  frame();
}
try{ initScene(document.getElementById('bg')); }
catch(e){ var el=document.getElementById('err'); el.style.display='block'; el.textContent='3D 씬 오류: '+(e&&e.message||e); console.error(e); }
</script>
</body></html>
